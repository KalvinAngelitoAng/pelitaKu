<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PelitaKu - Masuk</title>

    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Gaya PelitaKu -->
    <link href="css/style.css?v=1" rel="stylesheet">
</head>
<body>

    <div class="wadah-login">
        <div class="kartu-login">

            <div class="text-center mb-4">
                <div class="logo-pelitaku">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="11" fill="#FFC947"/>
                        <path d="M12 4L14 10H20L15 14L17 20L12 16.5L7 20L9 14L4 10H10L12 4Z" fill="#3D7EB0"/>
                    </svg>
                    <h1 class="judul-aplikasi">PelitaKu</h1>
                </div>
                <p class="teks-lembut mb-0">Sekolah Minggu jadi lebih seru dan penuh berkat</p>
            </div>

            <form id="formLogin">
                <div class="mb-3">
                    <label for="inputEmail" class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control form-control-pelitaku" id="inputEmail"
                        placeholder="nama@email.com" required>
                </div>

                <div class="mb-3">
                    <label for="inputPassword" class="form-label fw-bold">Kata Sandi</label>
                    <input type="password" class="form-control form-control-pelitaku" id="inputPassword"
                        placeholder="Masukkan kata sandi" required>
                </div>

                <div id="pesanStatusLogin" class="mb-3"></div>

                <button type="submit" class="btn btn-pelitaku-primer w-100" id="tombolMasuk">
                    Masuk
                </button>
            </form>

            <p class="text-center teks-lembut mt-4 mb-0" style="font-size: 0.85rem;">
                Akun hanya dibuat oleh guru pembina.<br>Hubungi guru pembinamu jika belum memiliki akun.
            </p>
        </div>
    </div>

    <!-- Supabase JS SDK via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js?v=1"></script>
    <script src="js/auth.js?v=1"></script>
</body>
</html>
