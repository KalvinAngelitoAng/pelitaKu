<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pelitaku - Masuk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div class="wadah-login">
        <div class="kartu-login">

            <div class="text-center mb-4">
                <div class="logo-pelitaku">
                    <svg class="lentera" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="50" cy="90" rx="26" ry="4" fill="#2E3A46" opacity="0.08"/>
                        <path d="M50 8 L58 22 L42 22 Z" fill="var(--biru-gelap)"/>
                        <rect x="46" y="20" width="8" height="8" fill="var(--biru-gelap)"/>
                        <path d="M30 30 Q50 20 70 30 L66 62 Q50 72 34 62 Z" fill="var(--kuning)" stroke="var(--kuning-gelap)" stroke-width="2"/>
                        <circle cx="50" cy="46" r="12" fill="#FFF4D6"/>
                        <path d="M50 36 Q56 44 50 54 Q44 44 50 36 Z" fill="var(--koral)"/>
                        rect x="40" y="62" width="20" height="6" rx="2" fill="var(--biru-gelap)"/>
                        <rect x="44" y="68" width="12" height="14" fill="#8AA6B1"/>
                        <rect x="38" y="82" width="24" height="6" rx="3" fill="var(--biru-gelap)"/>
                    </svg>
                    <h1 class="judul-aplikasi">Pelitaku</h1>
                </div>
                <p class="teks-lembut mb-0">Sekolah Minggu jadi lebih seru dan penuh berkat</p>
            </div>

            <form id="formLogin">
                <div class="mb-3">
                    <label for="inputEmail" class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control form-control-pelitaku" id="inputEmail"
                        placeholder="nama@email.com" required>
                </div>

                <div class="mb-3">
                    <label for="inputPassword" class="form-label fw-bold">Kata Sandi</label>
                    <input type="password" class="form-control form-control-pelitaku" id="inputPassword"
                        placeholder="Masukkan kata sandi" required>
                </div>

                <div id="pesanStatusLogin" class="mb-3"></div>

                <button type="submit" class="btn btn-pelitaku-primer w-100" id="tombolMasuk">
                    Masuk
                </button>
            </form>

            <p class="text-center teks-lembut mt-4 mb-0" style="font-size: 0.85rem;">
                Akun hanya dibuat oleh guru pembina.<br>Hubungi guru pembinamu jika belum memiliki akun.
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
